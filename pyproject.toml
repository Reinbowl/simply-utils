[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simply-utils"
version = "0.2.1"
description = "Simple utility library for file management, image processing, and object detection workflows."
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/Reinbowl/simply-utils"

[tool.setuptools.packages.find]
where = ["."]
include = ["simply*"]

[tool.setuptools.package-data]
simply = ["detection/fonts/*.ttf"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8 naming
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
